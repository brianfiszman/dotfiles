name: Neovim smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-startup:
    name: Headless startup (Neovim 0.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.5

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl unzip ripgrep

      - name: Check shell syntax
        run: bash -n install.sh scripts/neovim-smoke-test.sh

      - name: Run isolated headless smoke test
        run: bash scripts/neovim-smoke-test.sh
