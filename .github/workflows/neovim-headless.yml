name: Neovim headless smoke test
run-name: ${{ github.workflow }} [nvim-ci-baseline base=${{ github.event.pull_request.base.sha || github.sha }} pr_head=${{ github.event.pull_request.head.sha || github.sha }} tested=${{ github.sha }}]

on:
  push:
    branches:
      - master
    paths:
      - ".config/nvim/**"
      - "tests/nvim/**"
      - ".agents/skills/**"
      - "install.sh"
      - "scripts/test-nvim-headless.sh"
      - "scripts/test-linux-terminal-focus.sh"
      - "scripts/run_terminal_focus_probe.py"
      - "tests/ci/test_terminal_focus_probe.py"
      - "scripts/test-python-provider.sh"
      - ".github/workflows/neovim-headless.yml"
      - "README.md"
      - "scripts/ci/**"
      - "tests/ci/**"
  # Always create PR checks. The integration job below decides from the
  # commits since the last successful integration, avoiding path-filter
  # Pending checks while still skipping redundant docs-only integrations.
  pull_request:
  schedule:
    - cron: "21 4 * * 1"
  workflow_dispatch:

# A new commit supersedes an older run for the same PR/branch.
concurrency:
  group: neovim-headless-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  integration-decision:
    name: Decide whether full integration is required
    runs-on: ubuntu-26.04
    outputs:
      required: ${{ steps.decide.outputs.required }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Compare changes since the last successful PR integration
        id: decide
        uses: actions/github-script@v9
        with:
          script: |
            const { determineIntegrationRequirement } = require("./scripts/ci/neovim-integration-decision.cjs");
            const decision = await determineIntegrationRequirement({ context, github });
            core.setOutput("required", decision.required ? "true" : "false");
            core.setOutput("reason", decision.reason);
            core.info("Full integration: " + (decision.required ? "required" : "skipped") + " — " + decision.reason);

  fast-checks:
    name: Fast shell and lockfile checks
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Neovim for the real bootstrap tests
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/neovim-bootstrap.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "NVIM_BIN=$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version | sed -n '1,3p'

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n install.sh
          bash -n scripts/test-nvim-headless.sh
          bash -n scripts/test-python-provider.sh
          bash -n scripts/test-linux-terminal-focus.sh
          python3 -m py_compile scripts/run_terminal_focus_probe.py
          python3 tests/ci/test_terminal_focus_probe.py

      - name: Validate lazy.nvim lockfile JSON
        run: python3 -m json.tool .config/nvim/lazy-lock.json > /dev/null

      - name: Test PR integration decision and fail-open behavior
        run: node --test tests/ci/neovim-integration-decision.test.cjs

      - name: Test dependency cache keys and cold-path safeguards
        run: node --test tests/ci/neovim-cache-contract.test.cjs

      - name: Test Neovim focus PTY startup-prompt handling
        run: python3 tests/ci/test-nvim-focus-pty.py

      - name: Test bounded Neovim RPC commands
        run: python3 tests/ci/test-nvim-rpc-timeout.py

      - name: Test real lazy.nvim bootstrap failure and recovery paths
        run: node --test tests/ci/neovim-bootstrap.test.cjs


  headless-startup:
    name: Fresh install and headless startup (Neovim ${{ matrix.neovim-version }})
    needs: integration-decision
    if: ${{ !cancelled() && (needs.integration-decision.result != 'success' || needs.integration-decision.outputs.required != 'false') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        neovim-version:
          - v0.12.6
    env:
      NEOVIM_VERSION: ${{ matrix.neovim-version }}
      NVIM_BIN: nvim
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # This exact version exists in the ubuntu-26.04 hosted tool cache. Keep
      # Go explicit: the real Mason DAP test installs Delve from source.
      - name: Set up pinned Go from the hosted tool cache
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          check-latest: false
          cache: false

      # Do not apt-install toolchains already present on the image. The old
      # nodejs/npm apt packages downgraded the image's Node 24/npm 11 and pulled
      # in hundreds of packages. Keep this probe visible in the Actions log.
      - name: Verify hosted runner toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          for tool in git curl cmake gcc g++ make node npm python3 go \
            sha256sum gnutimeout find grep tee tar unzip; do
            command -v "$tool" >/dev/null || {
              printf 'Required hosted-runner command is missing: %s\n' "$tool" >&2
              exit 1
            }
          done

          printf 'Timeout supervisor: %s (%s)\n' "$(command -v gnutimeout)" "$(gnutimeout --version 2>&1 | sed -n '1p')"

          printf 'Runner image: %s\n' "$ImageOS / $ImageVersion"
          printf 'Node: '; node --version
          printf 'npm: '; npm --version
          printf 'Go: '; go version
          printf 'CMake: '; cmake --version | sed -n '1p'
          printf 'GCC: '; gcc --version | sed -n '1p'
          printf 'G++: '; g++ --version | sed -n '1p'
          printf 'Python: '; python3 --version

      - name: Install only missing Neovim build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail

          required_packages=(
            fd-find
            openbox
            procps
            wmctrl
            x11-utils
            xauth
            xterm
            xfonts-base
            xdotool
            xvfb
            libreadline-dev
            liblua5.1-0-dev
            lua5.1
            python3-venv
            ripgrep
            zsh
          )
          missing_packages=()

          for package in "${required_packages[@]}"; do
            status="$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)"
            if [[ "$status" != "installed" ]]; then
              missing_packages+=("$package")
            fi
          done

          if ((${#missing_packages[@]} == 0)); then
            echo "All supplemental build prerequisites are already installed."
          else
            printf 'Installing missing prerequisites only: %s\n' "${missing_packages[*]}"
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${missing_packages[@]}"
          fi

          command -v fdfind >/dev/null
          command -v rg >/dev/null
          command -v zsh >/dev/null
          test -x /bin/zsh
          python3 -m venv --help > /dev/null
          test -f /usr/include/readline/readline.h
          test -f /usr/include/lua5.1/lua.h

      - name: Install pinned Neovim
        run: |
          archive="$RUNNER_TEMP/neovim.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/$NEOVIM_VERSION/nvim-linux-x86_64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install pinned LuaLS for real completion coverage
        run: |
          version="3.19.2"
          archive="$RUNNER_TEMP/lua-language-server-$version.tar.gz"
          install_dir="$RUNNER_TEMP/lua-language-server"
          curl --fail --location --retry 3 \
            "https://github.com/LuaLS/lua-language-server/releases/download/$version/lua-language-server-$version-linux-x64.tar.gz" \
            --output "$archive"
          echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/lua-language-server" --version

      - name: Configure isolated test workspace
        run: echo "NVIM_TEST_DIR=$RUNNER_TEMP/nvim-headless-smoke" >> "$GITHUB_ENV"

      - name: Validate lazy.nvim lockfile JSON
        run: python3 -m json.tool .config/nvim/lazy-lock.json > /dev/null

      - name: Prepare isolated install and verify installer safety
        run: bash ./scripts/test-nvim-headless.sh prepare

      - name: Resolve and pin Mason registry release
        id: mason-registry
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          registry_version="$(
            curl --fail --silent --show-error --retry 3 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/mason-org/mason-registry/releases/latest |
            python3 -c 'import json, re, sys; version = json.load(sys.stdin).get("tag_name", ""); assert re.fullmatch(r"[A-Za-z0-9._-]+", version), "Invalid Mason registry release tag"; print(version)'
          )"
          echo "version=$registry_version" >> "$GITHUB_OUTPUT"
          echo "DOTFILES_MASON_REGISTRY_VERSION=$registry_version" >> "$GITHUB_ENV"

      - name: Fingerprint installed Linux plugin-build toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            printf 'runner=%s/%s\n' "$ImageOS" "$ImageVersion"
            printf 'neovim=%s\n' "$NEOVIM_VERSION"
            printf 'node=%s\n' "$(node --version)"
            printf 'npm=%s\n' "$(npm --version)"
            printf 'go=%s\n' "$(go version)"
            printf 'cmake=%s\n' "$(cmake --version | sed -n '1p')"
            printf 'gcc=%s\n' "$(gcc --version | sed -n '1p')"
            printf 'g++=%s\n' "$(g++ --version | sed -n '1p')"
            printf 'python=%s\n' "$(python3 --version)"
            printf 'gnutimeout=%s\n' "$(gnutimeout --version 2>&1 | sed -n '1p')"
            printf 'rust=%s\n' "$(rustc --version 2>/dev/null || echo missing)"
            printf 'cargo=%s\n' "$(cargo --version 2>/dev/null || echo missing)"
            for package in fd-find openbox procps wmctrl x11-utils xauth xterm xfonts-base xdotool xvfb libreadline-dev liblua5.1-0-dev lua5.1 python3-venv ripgrep zsh; do
              printf 'apt:%s=%s\n' "$package" "$(dpkg-query -W -f='${Version}' "$package")"
            done
          } | tee "$RUNNER_TEMP/plugin-toolchain.txt"
          fingerprint="$(sha256sum "$RUNNER_TEMP/plugin-toolchain.txt" | awk '{print $1}')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # Caches are exact-key only, and only trusted same-repository PRs can read/write them.
      # Schedule/manual dispatch intentionally stay cold to validate clean installation.
      - name: Restore locked lazy.nvim plugin checkouts
        id: lazy-plugin-cache
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nvim-headless-smoke/data/nvim/lazy
          key: nvim-lazy-${{ runner.os }}-${{ runner.arch }}-nvim-${{ env.NEOVIM_VERSION }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('.config/nvim/lazy-lock.json', '.config/nvim/**/*.lua', 'scripts/test-nvim-headless.sh', '.github/workflows/neovim-headless.yml') }}

      - name: Restore Mason packages and pinned registry
        id: mason-cache
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/nvim-headless-smoke/data/nvim/mason
            ${{ runner.temp }}/nvim-headless-smoke/cache/nvim/mason-registry-update
          key: nvim-mason-${{ runner.os }}-${{ runner.arch }}-nvim-${{ env.NEOVIM_VERSION }}-registry-${{ steps.mason-registry.outputs.version }}-toolchain-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('.config/nvim/lazy-lock.json', '.config/nvim/**/*.lua') }}

      - name: Restore compiled Tree-sitter parsers
        id: treesitter-parser-cache
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/nvim-headless-smoke/data/nvim/site/parser
            ${{ runner.temp }}/nvim-headless-smoke/data/nvim/site/queries
            ${{ runner.temp }}/nvim-headless-smoke/data/nvim/site/parser-info
          key: nvim-treesitter-runtime-v2-${{ runner.os }}-${{ runner.arch }}-nvim-${{ env.NEOVIM_VERSION }}-cli-v0.27.2-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('.config/nvim/lazy-lock.json', '.config/nvim/lua/treesitter.lua', 'tests/nvim/treesitter-current-api.lua', 'tests/nvim/treesitter-provisioning.lua') }}

      - name: Install GDB for a cache-hit build backtrace
        if: ${{ steps.lazy-plugin-cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends gdb libc6-dbg
          fi

      - name: Restore locked plugins and run configured build hooks
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ steps.lazy-plugin-cache.outputs.cache-hit }}" == "true" ]]; then
            wrapper="$RUNNER_TEMP/nvim-gdb-cache-build"
            cat > "$wrapper" <<'WRAPPER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          real_nvim="$(command -v nvim)"
          for arg in "$@"; do
            if [[ "$arg" == "+Lazy! build all" ]]; then
              printf '[cache-build-debug] Capturing loader finalization trace and symbolized native backtrace.\n' >&2
              trace_prefix="$RUNNER_TEMP/nvim-headless-smoke/loader-debug"
              set +e
              gdb --batch --quiet --return-child-result \
                -ex 'set pagination off' \
                -ex 'set confirm off' \
                -ex 'set debuginfod enabled off' \
                -ex 'set environment LD_DEBUG files' \
                -ex "set environment LD_DEBUG_OUTPUT $trace_prefix" \
                -ex run \
                -ex 'info sharedlibrary' \
                -ex 'info proc mappings' \
                -ex 'info threads' \
                -ex 'thread apply all bt full' \
                --args "$real_nvim" "$@"
              status=$?
              shopt -s nullglob
              trace_files=("$trace_prefix".*)
              if ((${#trace_files[@]} > 0)); then
                for trace_file in "${trace_files[@]}"; do
                  printf '\n===== %s =====\n' "$trace_file"
                  cat "$trace_file"
                done > "$RUNNER_TEMP/nvim-headless-smoke/loader-debug.log"
              else
                printf '[cache-build-debug] LD_DEBUG produced no trace files.\n' > "$RUNNER_TEMP/nvim-headless-smoke/loader-debug.log"
              fi
              exit "$status"
            fi
          done
          exec "$real_nvim" "$@"
          WRAPPER
            chmod 700 "$wrapper"
            NVIM_BIN="$wrapper" bash ./scripts/test-nvim-headless.sh restore
          else
            bash ./scripts/test-nvim-headless.sh restore
          fi
        env:
          NVIM_RESTORE_TIMEOUT: 20m
          DOTFILES_PLUGIN_CACHE_HIT: ${{ steps.lazy-plugin-cache.outputs.cache-hit }}

      - name: Verify native Linux xterm focus reaches Neovim through a real PTY
        env:
          NVIM_TEST_DIR: ${{ runner.temp }}/nvim-headless-smoke
          NVIM_BIN: nvim
        run: bash ./scripts/test-linux-terminal-focus.sh

      - name: Start Neovim normally after plugin restore
        run: bash ./scripts/test-nvim-headless.sh startup
        env:
          NVIM_STARTUP_TIMEOUT: 30m

      - name: Run isolated real Python provider provisioning and fresh-start checks
        run: bash ./scripts/test-python-provider.sh

      - name: Upload headless logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvim-headless-smoke-logs-${{ matrix.neovim-version }}
          path: |
            ${{ runner.temp }}/nvim-headless-smoke/*.log
            ${{ runner.temp }}/nvim-headless-smoke/state/nvim/*.log
          if-no-files-found: ignore
