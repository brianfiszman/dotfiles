name: Neovim headless smoke test
run-name: ${{ github.workflow }} [nvim-ci-baseline base=${{ github.event.pull_request.base.sha || github.sha }} pr_head=${{ github.event.pull_request.head.sha || github.sha }} tested=${{ github.sha }}]

on:
  push:
    branches:
      - master
    paths:
      - ".config/nvim/**"
      - "tests/nvim/**"
      - ".agents/skills/**"
      - "install.sh"
      - "scripts/test-nvim-headless.sh"
      - "scripts/test-macos-terminal-focus.sh"
      - "scripts/test-python-provider-macos.sh"
      - ".github/workflows/neovim-headless.yml"
      - "README.md"
      - "scripts/ci/**"
      - "tests/ci/**"
  # Always create PR checks. The integration job below decides from the
  # commits since the last successful integration, avoiding path-filter
  # Pending checks while still skipping redundant docs-only integrations.
  pull_request:
  schedule:
    - cron: "21 4 * * 1"
  workflow_dispatch:

# A new commit supersedes an older run for the same PR/branch.
concurrency:
  group: neovim-headless-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  integration-decision:
    name: Decide whether full integration is required
    runs-on: ubuntu-26.04
    outputs:
      required: ${{ steps.decide.outputs.required }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Compare changes since the last successful PR integration
        id: decide
        uses: actions/github-script@v9
        with:
          script: |
            const { determineIntegrationRequirement } = require("./scripts/ci/neovim-integration-decision.cjs");
            const decision = await determineIntegrationRequirement({ context, github });
            core.setOutput("required", decision.required ? "true" : "false");
            core.setOutput("reason", decision.reason);
            core.info("Full integration: " + (decision.required ? "required" : "skipped") + " — " + decision.reason);

  fast-checks:
    name: Fast shell and lockfile checks
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Neovim for the real bootstrap tests
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/neovim-bootstrap.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "NVIM_BIN=$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version | sed -n '1,3p'

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n install.sh
          bash -n scripts/test-nvim-headless.sh
          bash -n scripts/test-python-provider-macos.sh
          bash -n scripts/test-macos-terminal-focus.sh

      - name: Validate lazy.nvim lockfile JSON
        run: python3 -m json.tool .config/nvim/lazy-lock.json > /dev/null

      - name: Test PR integration decision and fail-open behavior
        run: node --test tests/ci/neovim-integration-decision.test.cjs

      - name: Test real lazy.nvim bootstrap failure and recovery paths
        run: node --test tests/ci/neovim-bootstrap.test.cjs


  python-provider-macos:
    name: macOS plugin restore and Python provider
    needs: integration-decision
    if: ${{ !cancelled() && (needs.integration-decision.result != 'success' || needs.integration-decision.outputs.required != 'false') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python for the provider test
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned Neovim
        shell: bash
        run: |
          set -Eeuo pipefail

          case "$(uname -m)" in
            arm64)
              archive_name="nvim-macos-arm64.tar.gz"
              archive_sha256="1dbd148222b051ba6c307c4d17a318ed083df018a4f6a5a0ce46955ffc9ab87b"
              install_dir="nvim-macos-arm64"
              ;;
            x86_64)
              archive_name="nvim-macos-x86_64.tar.gz"
              archive_sha256="481424f1dbc85f637d57e47d27d042aa9c883e5a4fe9ee64fc4ee9573b221998"
              install_dir="nvim-macos-x86_64"
              ;;
            *)
              printf 'Unsupported macOS runner architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac

          archive="$RUNNER_TEMP/$archive_name"
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v0.12.6/$archive_name" \
            --output "$archive"
          printf '%s  %s\n' "$archive_sha256" "$archive" | shasum --algorithm 256 --check
          xattr -c "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$install_dir/bin" >> "$GITHUB_PATH"

      - name: Verify the macOS runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          nvim --version | sed -n '1,3p'
          python3 --version
          command -v git

      - name: Prepare isolated Neovim install for macOS plugin restore
        env:
          NVIM_TEST_DIR: ${{ runner.temp }}/nvim-headless-macos
        run: bash ./scripts/test-nvim-headless.sh prepare

      - name: Restore locked plugins and verify Avante prebuilt libraries on macOS
        env:
          NVIM_TEST_DIR: ${{ runner.temp }}/nvim-headless-macos
          NVIM_RESTORE_TIMEOUT: 25m
        run: bash ./scripts/test-nvim-headless.sh restore

      - name: Verify Terminal.app window activation reports native Neovim focus events
        env:
          NVIM_TEST_DIR: ${{ runner.temp }}/nvim-headless-macos
          NVIM_BIN: nvim
        run: bash ./scripts/test-macos-terminal-focus.sh

      - name: Run isolated real provider provisioning and fresh-start checks
        run: bash ./scripts/test-python-provider-macos.sh

  headless-startup:
    name: Fresh install and headless startup (Neovim ${{ matrix.neovim-version }})
    needs: integration-decision
    if: ${{ !cancelled() && (needs.integration-decision.result != 'success' || needs.integration-decision.outputs.required != 'false') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        neovim-version:
          - v0.12.6
    env:
      NEOVIM_VERSION: ${{ matrix.neovim-version }}
      NVIM_BIN: nvim
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # This exact version exists in the ubuntu-26.04 hosted tool cache. Keep
      # Go explicit: the real Mason DAP test installs Delve from source.
      - name: Set up pinned Go from the hosted tool cache
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          check-latest: false
          cache: false

      # Do not apt-install toolchains already present on the image. The old
      # nodejs/npm apt packages downgraded the image's Node 24/npm 11 and pulled
      # in hundreds of packages. Keep this probe visible in the Actions log.
      - name: Verify hosted runner toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          for tool in git curl cmake gcc g++ make node npm python3 go \
            sha256sum timeout find grep tee tar unzip; do
            command -v "$tool" >/dev/null || {
              printf 'Required hosted-runner command is missing: %s\\n' "$tool" >&2
              exit 1
            }
          done

          printf 'Runner image: %s\\n' "$ImageOS / $ImageVersion"
          printf 'Node: '; node --version
          printf 'npm: '; npm --version
          printf 'Go: '; go version
          printf 'CMake: '; cmake --version | sed -n '1p'
          printf 'GCC: '; gcc --version | sed -n '1p'
          printf 'G++: '; g++ --version | sed -n '1p'
          printf 'Python: '; python3 --version

          {
            printf 'runner=%s/%s\\n' "$ImageOS" "$ImageVersion"
            printf 'neovim=%s\\n' "$NEOVIM_VERSION"
            printf 'node=%s\\n' "$(node --version)"
            printf 'npm=%s\\n' "$(npm --version)"
            printf 'go=%s\\n' "$(go version)"
            printf 'cmake=%s\\n' "$(cmake --version | sed -n '1p')"
            printf 'gcc=%s\\n' "$(gcc --version | sed -n '1p')"
            printf 'g++=%s\\n' "$(g++ --version | sed -n '1p')"
            printf 'python=%s\\n' "$(python3 --version)"
            printf 'rust=%s\\n' "$(rustc --version 2>/dev/null || echo missing)"
            printf 'cargo=%s\\n' "$(cargo --version 2>/dev/null || echo missing)"
          } | tee "$RUNNER_TEMP/plugin-toolchain.txt"
          fingerprint="$(sha256sum "$RUNNER_TEMP/plugin-toolchain.txt" | awk '{print $1}')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Install only missing Neovim build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail

          required_packages=(
            fd-find
            libreadline-dev
            liblua5.1-0-dev
            lua5.1
            python3-venv
            ripgrep
            zsh
          )
          missing_packages=()

          for package in "${required_packages[@]}"; do
            status="$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)"
            if [[ "$status" != "installed" ]]; then
              missing_packages+=("$package")
            fi
          done

          if ((${#missing_packages[@]} == 0)); then
            echo "All supplemental build prerequisites are already installed."
          else
            printf 'Installing missing prerequisites only: %s\n' "${missing_packages[*]}"
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${missing_packages[@]}"
          fi

          command -v fdfind >/dev/null
          command -v rg >/dev/null
          command -v zsh >/dev/null
          test -x /bin/zsh
          python3 -m venv --help > /dev/null
          test -f /usr/include/readline/readline.h
          test -f /usr/include/lua5.1/lua.h

      - name: Install pinned Neovim
        run: |
          archive="$RUNNER_TEMP/neovim.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/$NEOVIM_VERSION/nvim-linux-x86_64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install pinned LuaLS for real completion coverage
        run: |
          version="3.19.2"
          archive="$RUNNER_TEMP/lua-language-server-$version.tar.gz"
          install_dir="$RUNNER_TEMP/lua-language-server"
          curl --fail --location --retry 3 \
            "https://github.com/LuaLS/lua-language-server/releases/download/$version/lua-language-server-$version-linux-x64.tar.gz" \
            --output "$archive"
          echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/lua-language-server" --version

      - name: Configure isolated test workspace
        run: echo "NVIM_TEST_DIR=$RUNNER_TEMP/nvim-headless-smoke" >> "$GITHUB_ENV"

      - name: Validate lazy.nvim lockfile JSON
        run: python3 -m json.tool .config/nvim/lazy-lock.json > /dev/null

      - name: Prepare isolated install and verify installer safety
        run: bash ./scripts/test-nvim-headless.sh prepare

      - name: Restore locked plugins and run configured build hooks
        run: bash ./scripts/test-nvim-headless.sh restore
        env:
          NVIM_RESTORE_TIMEOUT: 20m

      - name: Start Neovim normally after plugin restore
        run: bash ./scripts/test-nvim-headless.sh startup
        env:
          NVIM_STARTUP_TIMEOUT: 30m

      - name: Upload headless logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvim-headless-smoke-logs-${{ matrix.neovim-version }}
          path: |
            ${{ runner.temp }}/nvim-headless-smoke/*.log
            ${{ runner.temp }}/nvim-headless-smoke/state/nvim/*.log
          if-no-files-found: ignore
