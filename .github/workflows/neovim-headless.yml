name: Neovim headless smoke test

on:
  push:
    branches:
      - master
    paths:
      - ".config/nvim/**"
      - "tests/nvim/**"
      - ".agents/skills/**"
      - "install.sh"
      - "scripts/test-nvim-headless.sh"
      - ".github/workflows/neovim-headless.yml"
      - "README.md"
  # Always create PR checks. The integration job below decides from the
  # commits since the last successful integration, avoiding path-filter
  # Pending checks while still skipping redundant docs-only integrations.
  pull_request:
  schedule:
    - cron: "21 4 * * 1"
  workflow_dispatch:

# A new commit supersedes an older run for the same PR/branch.
concurrency:
  group: neovim-headless-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  integration-decision:
    name: Decide whether full integration is required
    runs-on: ubuntu-26.04
    outputs:
      required: ${{ steps.decide.outputs.required }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Compare changes since the last successful PR integration
        id: decide
        uses: actions/github-script@v9
        with:
          script: |
            const decide = (required, reason) => {
              core.setOutput("required", required ? "true" : "false");
              core.setOutput("reason", reason);
              core.info(`Full integration: ${required ? "required" : "skipped"} — ${reason}`);
            };

            // Pushes to master, scheduled cold runs, and manual dispatch always
            // exercise the full clean-install/restore/build/startup path.
            if (context.eventName !== "pull_request") {
              decide(true, `${context.eventName} always runs the cold integration path`);
              return;
            }

            const pr = context.payload.pull_request;
            if (!pr?.head?.sha || !pr.head.ref || !pr.number) {
              decide(true, "PR payload is incomplete; fail open to full integration");
              return;
            }

            const { owner, repo } = context.repo;
            try {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "neovim-headless.yml",
                branch: pr.head.ref,
                event: "pull_request",
                status: "completed",
                per_page: 100,
              });

              const candidates = data.workflow_runs
                .filter((run) => {
                  if (
                    run.id === context.runId ||
                    run.head_sha === pr.head.sha ||
                    run.conclusion !== "success" ||
                    run.head_branch !== pr.head.ref
                  ) {
                    return false;
                  }

                  // Prefer an explicit PR association. Older API payloads may
                  // omit it; branch matching is the safe fallback for this
                  // repository's topic-branch-per-PR convention.
                  if (Array.isArray(run.pull_requests) && run.pull_requests.length > 0) {
                    return run.pull_requests.some((item) => item.number === pr.number);
                  }
                  return true;
                })
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

              let baseline = null;
              for (const run of candidates.slice(0, 25)) {
                const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                  filter: "latest",
                  per_page: 100,
                });
                const integration = jobs.jobs.find(
                  (job) => job.name === "Fresh install and headless startup"
                );
                if (integration?.conclusion === "success") {
                  baseline = run;
                  break;
                }
              }

              if (!baseline) {
                decide(true, "no previous successful full integration exists for this PR");
                return;
              }

              const comparison = await github.request(
                "GET /repos/{owner}/{repo}/compare/{base}...{head}",
                {
                  owner,
                  repo,
                  base: baseline.head_sha,
                  head: pr.head.sha,
                  per_page: 100,
                }
              );

              const result = comparison.data;
              if (
                result.status !== "ahead" ||
                !Array.isArray(result.files) ||
                result.files.length === 0 ||
                result.files.length >= 300 ||
                (result.total_commits ?? 0) >= 250
              ) {
                decide(true, "history diverged or the changed-file comparison may be incomplete");
                return;
              }

              const integrationPaths = (path) =>
                path.startsWith(".config/nvim/") ||
                path.startsWith("tests/nvim/") ||
                path.startsWith(".agents/skills/") ||
                path === "install.sh" ||
                path === "scripts/test-nvim-headless.sh" ||
                path === ".github/workflows/neovim-headless.yml" ||
                path === "README.md";

              const changedPaths = result.files.flatMap((file) =>
                [file.filename, file.previous_filename].filter(Boolean)
              );
              const relevant = changedPaths.filter(integrationPaths);

              if (relevant.length > 0) {
                decide(
                  true,
                  `integration-relevant files changed since ${baseline.head_sha.slice(0, 7)}: ${relevant.join(", ")}`
                );
              } else {
                decide(
                  false,
                  `only non-integration files changed since successful integration ${baseline.head_sha.slice(0, 7)}`
                );
              }
            } catch (error) {
              core.warning(`Could not safely determine the PR delta: ${error.message}`);
              decide(true, "integration-gating API failed; fail open to the full suite");
            }

  fast-checks:
    name: Fast shell and lockfile checks
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n install.sh
          bash -n scripts/test-nvim-headless.sh

      - name: Validate lazy.nvim lockfile JSON
        run: python3 -m json.tool .config/nvim/lazy-lock.json > /dev/null

  headless-startup:
    name: Fresh install and headless startup
    needs: integration-decision
    if: ${{ always() && (needs.integration-decision.result != 'success' || needs.integration-decision.outputs.required == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      NEOVIM_VERSION: v0.11.3
      NVIM_BIN: nvim
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # This exact version exists in the ubuntu-26.04 hosted tool cache. Keep
      # Go explicit: the real Mason DAP test installs Delve from source.
      - name: Set up pinned Go from the hosted tool cache
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          check-latest: false
          cache: false

      # Do not apt-install toolchains already present on the image. The old
      # nodejs/npm apt packages downgraded the image's Node 24/npm 11 and pulled
      # in hundreds of packages. Keep this probe visible in the Actions log.
      - name: Verify hosted runner toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          for tool in git curl cmake gcc g++ make node npm python3 rustc cargo go \
            sha256sum timeout find grep tee tar unzip; do
            command -v "$tool" >/dev/null || {
              printf 'Required hosted-runner command is missing: %s\n' "$tool" >&2
              exit 1
            }
          done

          printf 'Runner image: %s\n' "$ImageOS / $ImageVersion"
          printf 'Node: '; node --version
          printf 'npm: '; npm --version
          printf 'Go: '; go version
          printf 'Rust: '; rustc --version
          printf 'Cargo: '; cargo --version
          printf 'CMake: '; cmake --version | sed -n '1p'
          printf 'GCC: '; gcc --version | sed -n '1p'
          printf 'G++: '; g++ --version | sed -n '1p'
          printf 'Python: '; python3 --version

      - name: Install only missing Neovim build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail

          required_packages=(
            fd-find
            libreadline-dev
            liblua5.1-0-dev
            lua5.1
            python3-pynvim
            ripgrep
          )
          missing_packages=()

          for package in "${required_packages[@]}"; do
            status="$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)"
            if [[ "$status" != "installed" ]]; then
              missing_packages+=("$package")
            fi
          done

          if ((${#missing_packages[@]} == 0)); then
            echo "All supplemental build prerequisites are already installed."
          else
            printf 'Installing missing prerequisites only: %s\n' "${missing_packages[*]}"
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${missing_packages[@]}"
          fi

          command -v fdfind >/dev/null
          command -v rg >/dev/null
          python3 -c 'import pynvim; print("pynvim:", pynvim.__version__)'
          test -f /usr/include/readline/readline.h
          test -f /usr/include/lua5.1/lua.h

      - name: Install pinned Neovim
        run: |
          archive="$RUNNER_TEMP/neovim.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/neovim/neovim/releases/download/$NEOVIM_VERSION/nvim-linux-x86_64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install pinned LuaLS for real completion coverage
        run: |
          version="3.19.2"
          archive="$RUNNER_TEMP/lua-language-server-$version.tar.gz"
          install_dir="$RUNNER_TEMP/lua-language-server"
          curl --fail --location --retry 3 \
            "https://github.com/LuaLS/lua-language-server/releases/download/$version/lua-language-server-$version-linux-x64.tar.gz" \
            --output "$archive"
          echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  $archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/lua-language-server" --version

      - name: Configure isolated test workspace
        run: echo "NVIM_TEST_DIR=$RUNNER_TEMP/nvim-headless-smoke" >> "$GITHUB_ENV"

      - name: Validate lazy.nvim lockfile JSON
        run: python3 -m json.tool .config/nvim/lazy-lock.json > /dev/null

      - name: Prepare isolated install and verify installer safety
        run: bash ./scripts/test-nvim-headless.sh prepare

      - name: Restore locked plugins and run configured build hooks
        run: bash ./scripts/test-nvim-headless.sh restore
        env:
          NVIM_RESTORE_TIMEOUT: 20m

      - name: Start Neovim normally after plugin restore
        run: bash ./scripts/test-nvim-headless.sh startup
        env:
          NVIM_STARTUP_TIMEOUT: 5m

      - name: Upload headless logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvim-headless-smoke-logs
          path: |
            ${{ runner.temp }}/nvim-headless-smoke/*.log
            ${{ runner.temp }}/nvim-headless-smoke/state/nvim/*.log
          if-no-files-found: ignore
